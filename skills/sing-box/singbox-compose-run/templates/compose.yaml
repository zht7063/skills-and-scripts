services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config.json:/etc/sing-box/config.json:ro
    command: -c /etc/sing-box/config.json run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
